[build]
  command = "npm run build"

  # Next.js and Prisma are build-time devDependencies. Keep them available even
  # when NODE_ENV=production is configured for the deployed function runtime.
  [build.environment]
    NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  included_files = [
    "backend/prisma/**",
    "node_modules/.prisma/client/**",
    "backend/node_modules/.prisma/client/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true
